packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  argon2: true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

overrides:
  "brace-expansion@>=1.0.0 <1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  "fast-uri@>=4.0.0 <4.2.3": "4.2.3"
  "undici@>=8.0.0 <8.12.2": "8.12.2"
  "@grpc/grpc-js@>=1.0.0 <1.14.5": "1.14.5"
  "@fastify/busboy@>=3.0.0 <3.2.2": "3.2.2"
  "archiver-utils@5.0.2>glob": "14.0.2"
  "archiver-utils@2.1.0>glob": "14.0.2"
  "archiver-utils@3.0.4>glob": "14.0.2"
  "readdir-glob@1.1.3>minimatch": "11.0.1"
  "exceljs@4.4.0>unzipper": "0.12.5"
  "exceljs@4.4.0>uuid": "11.1.1"

# pnpm 11 起构建脚本许可在此声明。
# esbuild：vite/vitest 运行依赖；argon2：密码哈希原生绑定（W02）。
# cpu-features/protobufjs/ssh2 为可选原生绑定，本地开发不需要。
onlyBuiltDependencies:
  - "esbuild"
  - "argon2"
