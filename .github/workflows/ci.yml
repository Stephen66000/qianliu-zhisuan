# 仟流智算 HIGH 风险候选质量门禁。
name: ci

on:
  push:
    branches: [main, "milestone/**", "wp/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:qianliu@127.0.0.1:5432/qianliu_e2e
      GATEWAY_KEY_PEPPER: ci-only-gateway-key-pepper-32-bytes
      CREDENTIAL_KEK: ZGV2LW9ubHkta2VrLXJlcGxhY2UtaW4tcGlsb3QAAAA=
      COOKIE_SECRET: ci-only-cookie-secret-at-least-32-bytes
      WEB_ORIGIN: http://127.0.0.1:5173
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qianliu
          POSTGRES_DB: qianliu_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qianliu_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.11.0"
          run_install: false
      - run: corepack pnpm@11.11.0 install --frozen-lockfile
      - run: npm install --global @openai/codex@0.146.0
      - run: corepack pnpm@11.11.0 --filter @qianliu/web exec playwright install --with-deps chromium
      - run: corepack pnpm@11.11.0 run quality
      - run: corepack pnpm@11.11.0 run quality:mutation
      - run: corepack pnpm@11.11.0 run test:e2e
