# 仟流智算本地与试点编排
# 依据：工程规则 §2（PG17/Redis8 digest 锁定）、§3（目录）、TRD §3.1（分层边界）、详细计划 §4.1（容量）。
# 一期形态：Web/Control API/Gateway/Worker/PostgreSQL/Redis 分容器；DB/Redis 不开放公网，Web/Gateway 经 HTTPS（试点由反代终止 TLS）。
#
# digest 锁定（工程规则 §2 行 40-41）：镜像用 tag@sha256 引用，避免 tag漂移。下列 digest 为多架构 manifest digest。
#   postgres:17-alpine  sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193  (W01 锁定)
#   redis:8-alpine      sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb  (W01 锁定)

name: qianliu-zhisuan

x-postgres-image: &postgres-image "postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193"
x-redis-image: &redis-image "redis:8-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb"

services:
  postgres:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qianliu}
      POSTGRES_USER: ${POSTGRES_USER:-qianliu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qianliu_dev_only}
    ports:
      - "127.0.0.1:5433:5432" # 仅本机；试点由部署层不暴露
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qianliu} -d ${POSTGRES_DB:-qianliu}"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: *redis-image
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"] # 派生状态可丢弃重建（架构图：Redis 不作为最终账本）
    ports:
      - "127.0.0.1:6380:6379" # 仅本机
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # 以下四个服务在 W01 仅占位；W02-W08 逐步填充实际镜像与启动命令。
  control-api:
    image: node:22.17.1-alpine
    working_dir: /app
    command: ["echo", "control-api placeholder; implemented in W02-W04"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    image: node:22.17.1-alpine
    working_dir: /app
    command: ["echo", "gateway placeholder; implemented in W05-W08"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: node:22.17.1-alpine
    working_dir: /app
    command: ["echo", "worker placeholder; implemented in later milestones"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22.17.1-alpine
    working_dir: /app
    command: ["echo", "web placeholder; implemented in W18-W23"]
    depends_on:
      control-api:
        condition: service_started

volumes:
  postgres-data:
