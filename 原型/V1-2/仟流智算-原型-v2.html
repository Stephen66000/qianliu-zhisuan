<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仟流智算 · K3 原型 v2</title>
<style>
/* ============ 设计令牌 · 仟流 Web 产品视觉规范 1.0 + 仪表盘补充草案0.1 ============ */
:root{
  --canvas:#F4F7FB; --surface:#FFFFFF; --surface-subtle:#F8FAFC; --surface-muted:#EEF2F6;
  --surface-brand-soft:#EEF4FE;
  --border:#D8E1EB; --border-strong:#7D8FA4; --border-subtle:#E3EAF2; /* 草案0.1 §1.3 Zone 外框 */
  --text-primary:#172033; --text-secondary:#526175; --text-tertiary:#6B7280; --text-disabled:#9AA6B2;
  --action-primary:#2F6FCE; --action-primary-hover:#255DB2; --action-primary-soft:#E8F0FD;
  --brand-blue:#417EE0; --accent-visual:#00D2D4;
  --success:#267A3D; --success-soft:#EAF6ED;
  --warning:#9A4A2E; --warning-soft:#FBEFE9;
  --danger:#C7352E; --danger-soft:#FDEDEC;
  --overlay:rgba(15,27,46,.48);
  --shadow-raised:0 12px 32px rgba(15,27,46,.12);
  --shadow-zone:0 4px 16px rgba(15,27,46,.06); /* 草案0.1 §2.2 核心区轻阴影 */
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"SFMono-Regular","SF Mono","Cascadia Code","JetBrains Mono","Menlo",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:14px}
body{font-family:var(--font);color:var(--text-primary);background:var(--canvas);font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:none;background:none;font-size:14px}
input,select,textarea{font-family:var(--font);font-size:14px;color:var(--text-primary)}
a{color:var(--action-primary);text-decoration:none}
.mono{font-family:var(--mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--action-primary-soft)}

/* ============ 壳层 ============ */
#app{display:flex;min-height:100vh}
.sidebar{width:256px;flex:0 0 256px;background:var(--surface);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{display:flex;align-items:center;gap:10px;padding:18px 20px 16px;border-bottom:1px solid var(--border-subtle)}
.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--brand-blue),#2F6FCE);display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-size:17px;line-height:24px;font-weight:600}
.brand-sub{font-size:12px;line-height:18px;color:var(--text-tertiary)}
.side-nav{flex:1;padding:12px 12px;overflow-y:auto}
.nav-group{font-size:12px;line-height:18px;color:var(--text-tertiary);padding:12px 10px 4px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:8px;color:var(--text-secondary);font-size:14px;font-weight:500;text-align:left;transition:background .14s}
.nav-item:hover{background:var(--surface-muted)}
.nav-item.active{background:var(--surface-brand-soft);color:var(--action-primary)}
.nav-item svg{width:18px;height:18px;flex:0 0 18px}
.nav-item .badge{margin-left:auto;font-size:12px;font-weight:500;padding:0 7px;border-radius:999px;background:var(--danger-soft);color:var(--danger)}
.side-user{border-top:1px solid var(--border-subtle);padding:12px 16px;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-muted);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:0 0 30px}
.side-user .u-name{font-size:13px;font-weight:500}
.side-user .u-role{font-size:12px;color:var(--text-tertiary);line-height:16px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;padding:0 32px;gap:16px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:16px;line-height:24px;font-weight:600}
.topbar .page-desc{font-size:12px;color:var(--text-tertiary)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
/* 二期 Agent 入口预留（FR-017：原型预留位置，功能关闭） */
.agent-slot{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px dashed var(--border);border-radius:8px;color:var(--text-disabled);font-size:13px;background:var(--surface-subtle)}
.agent-slot svg{width:15px;height:15px}
.scenario{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-tertiary)}
.scenario select{height:32px;padding:0 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-primary);font-size:13px}
.content{padding:24px 32px 48px;max-width:1440px;width:100%;margin:0 auto}
.view{display:none}
.view.active{display:block}

/* ============ 原型横幅 ============ */
.proto-banner{display:flex;align-items:center;gap:10px;background:var(--surface-brand-soft);border:1px solid #C9DDFB;border-radius:10px;padding:8px 14px;font-size:12px;color:var(--text-secondary);margin-bottom:16px}
.proto-banner b{color:var(--action-primary);font-weight:600}
.proto-banner .wt{margin-left:auto;color:var(--text-tertiary)}

/* ============ 通用组件 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:500;transition:background .14s,border-color .14s;white-space:nowrap}
.btn.primary{background:var(--action-primary);color:#fff}
.btn.primary:hover{background:var(--action-primary-hover)}
.btn.secondary{border:1px solid var(--border);background:var(--surface);color:var(--text-primary)}
.btn.secondary:hover{background:var(--surface-subtle)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger:hover{background:#B02E28}
.btn.ghost{color:var(--text-secondary);height:32px;padding:0 10px}
.btn.ghost:hover{background:var(--surface-muted)}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn:disabled{background:var(--surface-muted);color:var(--text-disabled);cursor:not-allowed;border:none}
.link-btn{color:var(--action-primary);font-size:13px;font-weight:500}
.link-btn:hover{text-decoration:underline}
.link-btn.danger-c{color:var(--danger)}

.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;line-height:1;white-space:nowrap}
.tag.gray{background:var(--surface-muted);color:var(--text-secondary)}
.tag.blue{background:var(--action-primary-soft);color:var(--action-primary)}
.tag.green{background:var(--success-soft);color:var(--success)}
.tag.orange{background:var(--warning-soft);color:var(--warning)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.card-pad{padding:16px}

/* ============ Zone 区域容器（仪表盘草案0.1 §1） ============ */
.zone{background:var(--surface);border:1px solid var(--border-subtle);border-radius:16px;padding:16px;margin-bottom:20px}
.zone.core{border-color:var(--border);box-shadow:var(--shadow-zone);padding:20px}
.zone-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.zone-title{font-size:16px;line-height:24px;font-weight:600}
.zone-desc{font-size:12px;color:var(--text-tertiary)}
.zone-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ============ 表格 ============ */
.tbl-wrap{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--surface-subtle);color:var(--text-secondary);font-weight:500;font-size:12px;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--surface-subtle)}
.tbl .r{text-align:right}
.tbl .cell-main{font-weight:600;font-size:15px;line-height:22px;color:var(--text-primary)}
.tbl .cell-sub{font-size:12px;color:var(--text-tertiary);line-height:17px}
.tbl .num{text-align:right}

/* ============ 表单 ============ */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.field label .req{color:var(--danger)}
.field .hint{font-size:12px;color:var(--text-tertiary);margin-top:5px;line-height:18px}
.input,.select{width:100%;height:36px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);transition:border-color .14s,box-shadow .14s}
.input:focus,.select:focus{outline:none;border-color:var(--action-primary);box-shadow:0 0 0 2px rgba(47,111,206,.18)}
.input:disabled{background:var(--surface-muted);color:var(--text-disabled);border-color:var(--border)}
.input.mono{font-family:var(--mono);font-size:13px}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;width:fit-content}
.seg button{height:34px;padding:0 16px;font-size:13px;color:var(--text-secondary);background:var(--surface)}
.seg button.on{background:var(--surface-brand-soft);color:var(--action-primary);font-weight:600}
.seg button + button{border-left:1px solid var(--border)}
.switch{position:relative;width:36px;height:20px;border-radius:999px;background:var(--surface-muted);transition:background .14s;flex:0 0 36px;border:1px solid var(--border)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:left .14s}
.switch.on{background:var(--action-primary);border-color:var(--action-primary)}
.switch.on::after{left:18px}
.switch-row{display:flex;align-items:center;gap:10px;font-size:13px}
.search-box{position:relative}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-tertiary)}
.search-box .input{padding-left:32px;width:220px;border-color:var(--border)}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filter-bar .select{width:auto;border-color:var(--border)}
.filter-bar .fb-label{font-size:12px;color:var(--text-tertiary)}

/* ============ 弹窗 ============ */
.modal-mask{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:48px 16px;overflow-y:auto}
.modal-mask.open{display:flex}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-raised);width:640px;max-width:100%;animation:mup .2s ease-out}
.modal.lg{width:760px}
.modal.sm{width:440px}
@keyframes mup{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:18px 24px 0}
.modal-title{font-size:18px;line-height:26px;font-weight:600}
.modal-x{margin-left:auto;width:30px;height:30px;border-radius:8px;color:var(--text-tertiary);display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--surface-muted)}
.modal-body{padding:16px 24px 8px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px 20px;border-top:1px solid var(--border-subtle);margin-top:12px}
.steps{display:flex;gap:0;margin-bottom:20px}
.step{flex:1;text-align:center;font-size:12px;color:var(--text-tertiary);position:relative;padding-top:26px}
.step::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--surface-muted);color:var(--text-tertiary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.step.on{color:var(--action-primary);font-weight:600}
.step.on::before{background:var(--action-primary);color:#fff}
.step.done::before{background:var(--success-soft);color:var(--success)}

/* ============ 首页看板专用 ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.kpi .k-label{font-size:12px;color:var(--text-tertiary);line-height:18px;display:flex;align-items:center;gap:5px}
.kpi .k-value{font-size:24px;line-height:32px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .k-sub{font-size:12px;color:var(--text-secondary);margin-top:2px}
.kpi .k-sub b{color:var(--action-primary);font-weight:600}
.kpi .k-sub .warn-c{color:var(--warning);font-weight:500}
.spark{display:flex;align-items:flex-end;gap:8px;margin-top:6px}
.stack-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-muted);margin:10px 0 6px}
.stack-bar i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.progress{height:6px;border-radius:3px;background:var(--surface-muted);overflow:hidden;min-width:80px}
.progress i{display:block;height:100%;background:var(--action-primary);border-radius:3px}
.progress.gray i{background:#B6C2CF}
.progress.orange i{background:var(--warning)}
.progress.red i{background:var(--danger)}
.ptxt{font-size:12px;color:var(--text-tertiary);margin-top:3px}

/* ============ 空状态 / 提示 ============ */
.empty{padding:44px 20px;text-align:center;color:var(--text-tertiary)}
.empty .e-icon{width:44px;height:44px;border-radius:12px;background:var(--surface-brand-soft);color:var(--brand-blue);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty .e-icon svg{width:22px;height:22px}
.empty .e-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:4px}
.empty .e-sub{font-size:13px;line-height:20px}
.notice{display:flex;gap:10px;border-radius:10px;padding:10px 14px;font-size:13px;line-height:20px;margin-bottom:14px;align-items:flex-start}
.notice svg{width:16px;height:16px;flex:0 0 16px;margin-top:2px}
.notice.warn{background:var(--warning-soft);color:var(--warning)}
.notice.err{background:var(--danger-soft);color:var(--danger)}
.notice.info{background:var(--action-primary-soft);color:var(--action-primary)}
.notice.ok{background:var(--success-soft);color:var(--success)}
.notice b{font-weight:600}

/* Key 展示框 */
.key-box{background:var(--surface-subtle);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:13px;word-break:break-all;display:flex;align-items:center;gap:10px}
.code-block{background:#172033;color:#D6E2F0;border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:20px;overflow-x:auto;white-space:pre;position:relative}
.code-block .cp{position:absolute;top:8px;right:8px}
.cp{height:26px;padding:0 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary)}
.cp:hover{background:var(--surface-subtle)}

/* 描述列表 */
.dl{display:grid;grid-template-columns:110px 1fr;row-gap:8px;column-gap:16px;font-size:13px}
.dl dt{color:var(--text-tertiary)}
.dl dd{color:var(--text-primary)}

/* 标签页 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{height:36px;padding:0 14px;font-size:14px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button.on{color:var(--action-primary);border-bottom-color:var(--action-primary);font-weight:600}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:1100px){.grid-2{grid-template-columns:1fr}}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.flex{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.tc-ter{color:var(--text-tertiary)}.fs12{font-size:12px}.fs13{font-size:13px}
.fw600{font-weight:600}

/* ============ 登录页 ============ */
#login{display:none;min-height:100vh;background:var(--canvas);align-items:center;justify-content:center;padding:24px}
#login.show{display:flex}
.login-card{width:400px;max-width:100%;background:var(--surface);border:1px solid var(--border-subtle);border-radius:16px;box-shadow:var(--shadow-zone);padding:36px 36px 28px}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.login-title{font-size:20px;line-height:28px;font-weight:700}
.login-sub{font-size:13px;color:var(--text-tertiary);margin-bottom:22px}
.login-foot{font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:18px;line-height:18px}

/* 响应式（草案 §5：断点只降列折叠） */
@media (max-width:1280px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1024px){.sidebar{width:64px;flex-basis:64px}.sidebar .brand-name,.sidebar .brand-sub,.sidebar .nav-item span,.sidebar .nav-group,.sidebar .u-meta,.sidebar .nav-item .badge{display:none}.nav-item{justify-content:center}.content{padding:20px 24px 40px}}
@media (max-width:860px){.kpi-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ================= 登录页 ================= -->
<div id="login" class="show">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M12 6l4 6-4 6-4-6z" fill="#00D2D4" stroke="none"/></svg></div>
      <div>
        <div class="login-title">仟流智算</div>
        <div class="fs12 tc-ter">QIANLIU INTELLICOMPUTE</div>
      </div>
    </div>
    <div class="login-sub">企业 AI 资源管理系统 · 管理员登录</div>
    <div class="field"><label>账号</label><input class="input" value="admin" id="login-user"></div>
    <div class="field"><label>密码</label><input class="input" type="password" value="••••••••"></div>
    <button class="btn primary" style="width:100%" onclick="doLogin()">登 录</button>
    <div class="login-foot">桌面 Web · Windows 11 / macOS Chrome<br>K3 原型 v2 · 仅演示，数据为模拟</div>
  </div>
</div>

<!-- ================= 应用壳 ================= -->
<div id="app" style="display:none">
  <!-- 侧栏 -->
  <aside class="sidebar">
    <div class="side-brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M12 6l4 6-4 6-4-6z" fill="#00D2D4" stroke="none"/></svg></div>
      <div>
        <div class="brand-name">仟流智算</div>
        <div class="brand-sub">企业 AI 资源管理</div>
      </div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-user">
      <div class="avatar">佳</div>
      <div class="u-meta">
        <div class="u-name">佳哥</div>
        <div class="u-role">管理员</div>
      </div>
      <button class="btn ghost sm" style="margin-left:auto" title="退出登录" onclick="doLogout()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">首页看板</h1>
        <div class="page-desc" id="pageDesc"></div>
      </div>
      <div class="topbar-right">
        <div class="scenario">
          <span>原型场景</span>
          <select id="scenarioSel" onchange="setScenario(this.value)">
            <option value="normal">常态 · 月中</option>
            <option value="empty">空态 · 初始化</option>
            <option value="exhaust">额度耗尽</option>
            <option value="down">资源不可用</option>
          </select>
        </div>
