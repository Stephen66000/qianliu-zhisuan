services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qianliu_poc
      POSTGRES_USER: qianliu_poc
      POSTGRES_PASSWORD: qianliu_poc_only
    ports:
      - "55437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qianliu_poc -d qianliu_poc"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
